<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>studio ailiers</title>
  <meta name="description" content="studio ailiers — Number Drop &amp; Dungeons 80.">
  <meta name="theme-color" content="#000000">
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background-color: #000000;
      color: #e6e6e6;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
    }
    main {
      min-height: 100vh;
      max-width: 680px;
      margin: 0 auto;
      padding: 56px 24px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 48px;
    }
    .logo-wrap {
      width: 100%;
      max-width: 440px;
    }
    .logo-wrap img {
      display: block;
      width: 100%;
      height: auto;
    }
    .games {
      list-style: none;
      width: 100%;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 32px;
    }
    @media (max-width: 540px) {
      .games {
        grid-template-columns: 1fr;
        max-width: 320px;
      }
    }
    .game-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 24px 20px;
      border: 1px solid #161616;
      border-radius: 20px;
      background-color: #070707;
    }
    .game-icon {
      width: 88px;
      height: 88px;
      border-radius: 22.5%;
      display: block;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    }
    .game-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 0.01em;
    }
    .game-desc {
      font-size: 0.9rem;
      color: #a3a3a3;
      max-width: 26ch;
    }
    .game-meta {
      margin-top: auto;
      padding-top: 4px;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #666666;
    }
    footer {
      margin-top: 8px;
      font-size: 0.82rem;
      color: #666666;
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      justify-content: center;
      align-items: center;
    }
    a {
      color: #9e9e9e;
      text-decoration: none;
    }
    a:hover {
      color: #ffffff;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
  </style>
</head>
<body>
  <main>
    <div class="logo-wrap">
      <img src="StudioLogo.png" alt="studio ailiers" width="1672" height="941">
    </div>

    <ul class="games" aria-label="Games">
      <li class="game-card">
        <img class="game-icon" src="number-drop-icon.png" alt="Number Drop icon" width="256" height="256">
        <h2 class="game-title">Number Drop</h2>
        <p class="game-desc">One tap. One number. Chain reactions in a 3D cube puzzle.</p>
        <span class="game-meta">iPhone</span>
      </li>
      <li class="game-card">
        <img class="game-icon" src="dungeons-80-icon.png" alt="Dungeons 80 icon" width="256" height="256">
        <h2 class="game-title">Dungeons 80</h2>
        <p class="game-desc">Hack-and-slash dark fantasy. Lose the crown, climb 80 floors back to the throne.</p>
        <span class="game-meta">iPhone &middot; Mac &middot; PC</span>
      </li>
    </ul>

    <footer>
      <a href="mailto:contact@studioailiers.com">contact@studioailiers.com</a>
      <span>&middot;</span>
      <a href="privacy.html">Privacy Policy</a>
      <span>&middot;</span>
      <span>&copy; 2026 studio ailiers</span>
    </footer>
  </main>
</body>
</html>
