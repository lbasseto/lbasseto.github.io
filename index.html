<!DOCTYPE html>

      padding: 0;

    }
    main {
      min-height: 100vh;
      max-width: 560px;
      margin: 0 auto;
      padding: 64px 24px 48px;

      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 64px;
    }
    .brand {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .wing {
      width: 154px;
      height: auto;
      display: block;
      transform: translateX(5px);
    }
    .studio-name {

      letter-spacing: 0.25em;
      padding-left: 0.25em;
      color: #ffffff;
      line-height: 1.15;
      text-transform: lowercase;
    }
    .games {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 28px;
      max-width: 420px;
    }
    .game-title {
      font-size: 1.25rem;
      font-weight: 400;
      letter-spacing: 0.22em;
      padding-left: 0.22em;
      color: #ffffff;
      margin-bottom: 4px;
    }
    .game-desc {
      font-size: 1rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      color: #8c8c8c;
    }
    footer {
      margin-top: 8px;
      font-size: 0.9rem;
      letter-spacing: 0.14em;
      color: #5e5e5e;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      justify-content: center;
      align-items: center;
    }
    a {
      color: #8c8c8c;
      text-decoration: none;
      transition: color 0.2s ease;
    }
    a:hover {
      color: #ffffff;
    }
