<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>studio ailiers</title>
  <meta name="description" content="studio ailiers — Number Drop &amp; Dungeons 80.">
  <meta name="theme-color" content="#000000">
  <style>
    @font-face {
      font-family: "Cormorant Garamond";
      src: url("CormorantGaramond.ttf") format("truetype");
      font-weight: 300 700;
      font-style: normal;
      font-display: swap;
    }
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background-color: #000000;
      color: #e8e8e8;
      font-family: "Cormorant Garamond", "EB Garamond", "Garamond", "Hoefler Text", "Apple Garamond", "Palatino", Georgia, serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    main {
      min-height: 100vh;
      max-width: 560px;
      margin: 0 auto;
      padding: 56px 24px 48px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 48px;
    }
    .logo-wrap {
      width: 100%;
      max-width: 460px;
    }
    .logo-wrap img {
      display: block;
      width: 100%;
      height: auto;
    }
    .games {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 28px;
      max-width: 420px;
    }
    .game-title {
      font-size: 1.25rem;
      font-weight: 400;
      letter-spacing: 0.22em;
      color: #ffffff;
      margin-bottom: 4px;
    }
    .game-desc {
      font-size: 0.98rem;
      font-weight: 400;
      letter-spacing: 0.04em;
      color: #8c8c8c;
    }
    footer {
      margin-top: 12px;
      font-size: 0.9rem;
      letter-spacing: 0.14em;
      color: #5e5e5e;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      justify-content: center;
      align-items: center;
    }
    a {
      color: #8c8c8c;
      text-decoration: none;
      transition: color 0.2s ease;
    }
    a:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>
  <main>
    <div class="logo-wrap">
      <img src="StudioLogo.png" alt="studio ailiers" width="1672" height="941">
    </div>

    <ul class="games" aria-label="Games">
      <li>
        <h2 class="game-title">Number Drop</h2>
        <p class="game-desc">One tap. One number. Chain reactions in a 3D cube puzzle.</p>
      </li>
      <li>
        <h2 class="game-title">Dungeons 80</h2>
        <p class="game-desc">Hack-and-slash dark fantasy. Lose the crown, climb eighty floors back to the throne.</p>
      </li>
    </ul>

    <footer>
      <a href="mailto:contact@studioailiers.com">contact@studioailiers.com</a>
      <span>&middot;</span>
      <a href="privacy.html">privacy</a>
    </footer>
  </main>
</body>
</html>
