<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>studio ailiers</title>
  <meta name="description" content="studio ailiers — Number Drop &amp; Dungeons 80.">
  <meta name="theme-color" content="#000000">
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background-color: #000000;
      color: #e6e6e6;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    main {
      min-height: 100vh;
      max-width: 560px;
      margin: 0 auto;
      padding: 48px 24px 64px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 32px;
    }
    .logo-wrap {
      width: 100%;
      max-width: 480px;
    }
    .logo-wrap img {
      display: block;
      width: 100%;
      height: auto;
    }
    .games {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 1.05rem;
      letter-spacing: 0.04em;
      color: #ffffff;
    }
    #support {
      padding-top: 24px;
      border-top: 1px solid #1a1a1a;
      width: 100%;
      max-width: 320px;
      font-size: 0.9rem;
      color: #8f8f8f;
    }
    a {
      color: #cfcfcf;
      text-decoration: underline;
      text-underline-offset: 3px;
    }
    a:hover {
      color: #ffffff;
    }
    footer {
      font-size: 0.8rem;
      color: #666666;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    footer nav {
      display: flex;
      gap: 16px;
      justify-content: center;
    }
  </style>
</head>
<body>
  <main>
    <div class="logo-wrap">
      <img src="StudioLogo.png" alt="studio ailiers" width="1672" height="941">
    </div>

    <ul class="games" aria-label="Games">
      <li>Number Drop</li>
      <li>Dungeons 80</li>
    </ul>

    <section id="support" aria-label="Support">
      <p>Support: <a href="mailto:contact@studioailiers.com">contact@studioailiers.com</a></p>
    </section>

    <footer>
      <nav aria-label="Footer links">
        <a href="#support">Support</a>
        <a href="privacy.html">Privacy Policy</a>
      </nav>
      <p>&copy; 2026 studio ailiers</p>
    </footer>
  </main>
</body>
</html>
