<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>studio ailiers</title>
  <meta name="description" content="studio ailiers — Number Drop &amp; Dungeons 80.">
  <meta name="theme-color" content="#000000">
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      background-color: #000000;
      color: #e8e8e8;
      font-family: "Cormorant Garamond", "EB Garamond", "Garamond", "Hoefler Text", "Apple Garamond", "Palatino", Georgia, serif;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    main {
      min-height: 100vh;
      max-width: 560px;
      margin: 0 auto;
      padding: 48px 24px 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      gap: 44px;
    }
    .logo-wrap {
      width: 100%;
      max-width: 460px;
    }
    .logo-wrap img {
      display: block;
      width: 100%;
      height: auto;
    }
    .games {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 14px;
      font-size: 1.15rem;
      font-weight: 400;
      letter-spacing: 0.22em;
      color: #d8d8d8;
    }
    footer {
      margin-top: 16px;
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      color: #666666;
      display: flex;
      flex-wrap: wrap;
      gap: 8px 16px;
      justify-content: center;
      align-items: center;
    }
    a {
      color: #8c8c8c;
      text-decoration: none;
      transition: color 0.2s ease;
    }
    a:hover {
      color: #ffffff;
    }
  </style>
</head>
<body>
  <main>
    <div class="logo-wrap">
      <img src="StudioLogo.png" alt="studio ailiers" width="1672" height="941">
    </div>

    <ul class="games" aria-label="Games">
      <li>Number Drop</li>
      <li>Dungeons 80</li>
    </ul>

    <footer>
      <a href="mailto:contact@studioailiers.com">contact@studioailiers.com</a>
      <span>&middot;</span>
      <a href="privacy.html">privacy</a>
    </footer>
  </main>
</body>
</html>
